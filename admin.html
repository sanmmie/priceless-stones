<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | De PricelessStones</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; background:#f0f2f5; color:#333; min-height:100vh; }
        :root { --sidebar-bg:#1a1a2e; --sidebar-hover:#16213e; --primary:#2C3E50; --accent:#e94560; --success:#27ae60; --warning:#f39c12; --info:#3498db; --white:#fff; }

        /* Login */
        .login-page { display:flex; align-items:center; justify-content:center; min-height:100vh; background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%); }
        .login-box { background:#fff; padding:40px; border-radius:12px; width:400px; max-width:90%; box-shadow:0 20px 60px rgba(0,0,0,0.3); text-align:center; }
        .login-box h1 { font-size:1.8rem; color:var(--primary); margin-bottom:8px; }
        .login-box .subtitle { color:#777; margin-bottom:30px; font-size:0.9rem; }
        .login-box .logo-icon { font-size:3rem; color:var(--accent); margin-bottom:15px; }

        .form-group { margin-bottom:20px; text-align:left; }
        .form-group label { display:block; margin-bottom:6px; font-weight:500; font-size:0.9rem; color:#555; }
        .form-group input,.form-group select,.form-group textarea { width:100%; padding:12px 14px; border:2px solid #e1e5eb; border-radius:8px; font-size:0.95rem; transition:border-color .3s; font-family:inherit; }
        .form-group input:focus,.form-group select:focus,.form-group textarea:focus { border-color:var(--primary); outline:none; }

        .btn { padding:12px 24px; border:none; border-radius:8px; font-size:0.95rem; font-weight:500; cursor:pointer; transition:all .3s; display:inline-flex; align-items:center; gap:8px; font-family:inherit; }
        .btn-primary { background:var(--primary); color:#fff; width:100%; justify-content:center; }
        .btn-primary:hover { background:#1a252f; }
        .btn-danger { background:#e74c3c; color:#fff; }
        .btn-danger:hover { background:#c0392b; }
        .btn-success { background:var(--success); color:#fff; }
        .btn-success:hover { background:#219a52; }
        .btn-info { background:var(--info); color:#fff; }
        .btn-info:hover { background:#2980b9; }
        .btn-warning { background:var(--warning); color:#fff; }
        .btn-sm { padding:8px 16px; font-size:0.85rem; }

        /* Layout */
        .admin-layout { display:flex; min-height:100vh; }
        .sidebar { width:260px; background:var(--sidebar-bg); color:#fff; position:fixed; top:0; left:0; bottom:0; z-index:1000; overflow-y:auto; transition:transform .3s; }
        .sidebar-header { padding:24px 20px; border-bottom:1px solid rgba(255,255,255,0.1); }
        .sidebar-header h2 { font-size:1.2rem; font-weight:600; }
        .sidebar-header span { color:var(--accent); }
        .sidebar-nav { padding:10px 0; }
        .sidebar-nav a { display:flex; align-items:center; gap:12px; padding:12px 20px; color:rgba(255,255,255,0.7); text-decoration:none; transition:all .3s; font-size:0.9rem; border-left:3px solid transparent; }
        .sidebar-nav a:hover,.sidebar-nav a.active { background:var(--sidebar-hover); color:#fff; border-left-color:var(--accent); }
        .sidebar-nav a i { width:20px; text-align:center; }
        .sidebar-footer { padding:20px; border-top:1px solid rgba(255,255,255,0.1); position:absolute; bottom:0; width:100%; }
        .sidebar-footer button { background:rgba(255,255,255,0.1); border:none; color:#fff; padding:10px 20px; border-radius:6px; cursor:pointer; width:100%; font-size:0.9rem; transition:all .3s; }
        .sidebar-footer button:hover { background:var(--accent); }

        .main-content { margin-left:260px; flex:1; padding:30px; }
        .top-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:30px; }
        .top-bar h1 { font-size:1.5rem; color:var(--primary); }
        .user-info { display:flex; align-items:center; gap:10px; color:#555; }
        .user-info .avatar { width:36px; height:36px; background:var(--primary); color:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:600; }

        /* Stats */
        .stats-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:20px; margin-bottom:30px; }
        .stat-card { background:#fff; padding:24px; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.06); transition:transform .3s; }
        .stat-card:hover { transform:translateY(-3px); }
        .stat-card .stat-icon { width:48px; height:48px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:1.3rem; margin-bottom:15px; }
        .stat-card .stat-icon.blue { background:#ebf5fb; color:var(--info); }
        .stat-card .stat-icon.green { background:#eafaf1; color:var(--success); }
        .stat-card .stat-icon.orange { background:#fef5e7; color:var(--warning); }
        .stat-card .stat-icon.red { background:#fdedec; color:var(--accent); }
        .stat-card .stat-value { font-size:1.8rem; font-weight:700; color:var(--primary); }
        .stat-card .stat-label { font-size:0.85rem; color:#777; margin-top:4px; }

        /* Cards */
        .card { background:#fff; border-radius:12px; box-shadow:0 2px 8px rgba(0,0,0,0.06); overflow:hidden; }
        .card-header { padding:20px 24px; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center; }
        .card-header h3 { font-size:1.1rem; color:var(--primary); }
        .card-body { padding:24px; }

        /* Table */
        .table-wrap { overflow-x:auto; }
        table { width:100%; border-collapse:collapse; }
        table th { background:#f8f9fa; padding:12px 16px; text-align:left; font-size:0.85rem; font-weight:600; color:#555; text-transform:uppercase; letter-spacing:.5px; }
        table td { padding:12px 16px; border-bottom:1px solid #f0f0f0; font-size:0.9rem; vertical-align:middle; }
        table tr:hover td { background:#fafbfc; }
        .badge { padding:4px 10px; border-radius:20px; font-size:0.8rem; font-weight:500; }
        .badge-success { background:#eafaf1; color:var(--success); }
        .badge-warning { background:#fef5e7; color:var(--warning); }
        .badge-danger { background:#fdedec; color:var(--accent); }
        .badge-info { background:#ebf5fb; color:var(--info); }
        .actions { display:flex; gap:6px; }
        .actions button { width:32px; height:32px; border:none; border-radius:6px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .3s; font-size:0.85rem; }
        .btn-edit { background:#ebf5fb; color:var(--info); }
        .btn-edit:hover { background:var(--info); color:#fff; }
        .btn-delete { background:#fdedec; color:var(--accent); }
        .btn-delete:hover { background:var(--accent); color:#fff; }

        /* Modal */
        .modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); display:none; align-items:center; justify-content:center; z-index:2000; }
        .modal-overlay.active { display:flex; }
        .modal { background:#fff; border-radius:12px; width:560px; max-width:90%; max-height:90vh; overflow-y:auto; animation:modalIn .3s ease; }
        @keyframes modalIn { from{opacity:0;transform:scale(.95)} to{opacity:1;transform:scale(1)} }
        .modal-header { padding:20px 24px; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center; }
        .modal-header h3 { font-size:1.1rem; }
        .modal-close { background:none; border:none; font-size:1.2rem; cursor:pointer; color:#999; }
        .modal-close:hover { color:#333; }
        .modal-body { padding:24px; }
        .modal-footer { padding:16px 24px; border-top:1px solid #eee; display:flex; justify-content:flex-end; gap:10px; }

        /* Toast */
        .toast-container { position:fixed; top:20px; right:20px; z-index:3000; display:flex; flex-direction:column; gap:10px; }
        .toast { padding:14px 20px; border-radius:8px; color:#fff; font-size:0.9rem; animation:toastIn .4s ease; display:flex; align-items:center; gap:10px; min-width:300px; box-shadow:0 8px 24px rgba(0,0,0,0.15); }
        .toast.success { background:var(--success); }
        .toast.error { background:#e74c3c; }
        .toast.info { background:var(--info); }
        @keyframes toastIn { from{opacity:0;transform:translateX(100px)} to{opacity:1;transform:translateX(0)} }

        /* Empty state */
        .empty-state { text-align:center; padding:60px 20px; color:#999; }
        .empty-state i { font-size:3rem; margin-bottom:15px; color:#ddd; }
        .empty-state p { font-size:0.95rem; }

        /* Search */
        .search-bar { display:flex; gap:10px; align-items:center; }
        .search-bar input { padding:10px 16px; border:2px solid #e1e5eb; border-radius:8px; font-size:0.9rem; width:260px; transition:border-color .3s; }
        .search-bar input:focus { border-color:var(--primary); outline:none; }

        /* Chart bars */
        .chart-bars { display:flex; align-items:flex-end; gap:12px; height:160px; padding-top:20px; }
        .bar-group { flex:1; text-align:center; }
        .bar { width:100%; max-width:40px; border-radius:6px 6px 0 0; margin:0 auto; transition:height .6s ease; }
        .bar-label { font-size:0.75rem; color:#999; margin-top:6px; }

        /* Orders status select */
        .status-select { padding:4px 8px; border-radius:6px; border:1px solid #ddd; font-size:0.8rem; cursor:pointer; }

        /* Mobile */
        .mobile-toggle { display:none; background:none; border:none; font-size:1.3rem; cursor:pointer; color:var(--primary); padding:8px; }

        @media(max-width:768px) {
            .sidebar { transform:translateX(-100%); }
            .sidebar.open { transform:translateX(0); }
            .main-content { margin-left:0; padding:20px 16px; }
            .mobile-toggle { display:block; }
            .stats-grid { grid-template-columns:1fr 1fr; }
            .top-bar { flex-direction:column; gap:12px; align-items:flex-start; }
            .search-bar input { width:100%; }
            .search-bar { width:100%; }
        }

        @media(prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; transition-duration:.01ms!important; } }

        .login-error { background:#fdedec; color:#c0392b; padding:10px; border-radius:6px; font-size:0.85rem; margin-bottom:15px; display:none; }
        .dashboard-grid { display:grid; grid-template-columns:2fr 1fr; gap:20px; }
        @media(max-width:1024px) { .dashboard-grid { grid-template-columns:1fr; } }
    </style>
</head>
<body>
    <div id="loginPage" class="login-page">
        <div class="login-box">
            <div class="logo-icon"><i class="fas fa-gem"></i></div>
            <h1>De PricelessStones</h1>
            <p class="subtitle">Store Management Panel</p>
            <div id="loginError" class="login-error"><i class="fas fa-exclamation-circle"></i> Invalid password. Please try again.</div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="adminPassword">Access Password</label>
                    <input type="password" id="adminPassword" placeholder="Enter your password" required autocomplete="off">
                </div>
                <button type="submit" class="btn btn-primary"><i class="fas fa-sign-in-alt"></i> Sign In</button>
            </form>
            <p style="margin-top:20px;font-size:0.8rem;color:#999">Password is configured by the site administrator</p>
        </div>
    </div>

    <div id="adminApp" style="display:none">
        <div class="admin-layout">
            <aside class="sidebar" id="sidebar">
                <div class="sidebar-header"><h2><span>De</span> PricelessStones</h2></div>
                <nav class="sidebar-nav">
                    <a href="#" data-page="dashboard" class="active"><i class="fas fa-tachometer-alt"></i> Dashboard</a>
                    <a href="#" data-page="products"><i class="fas fa-box-open"></i> Products</a>
                    <a href="#" data-page="discounts"><i class="fas fa-tags"></i> Discounts</a>
                    <a href="#" data-page="orders"><i class="fas fa-shopping-bag"></i> Orders</a>
                    <a href="#" data-page="settings"><i class="fas fa-cog"></i> Settings</a>
                </nav>
                <div class="sidebar-footer"><button id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Sign Out</button></div>
            </aside>

            <main class="main-content">
                <div class="top-bar">
                    <div style="display:flex;align-items:center;gap:12px">
                        <button class="mobile-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
                        <h1 id="pageTitle">Dashboard</h1>
                    </div>
                    <div class="user-info">
                        <div class="avatar">A</div>
                        <span id="lastLogin">Admin</span>
                    </div>
                </div>

                <div id="pageContent"></div>
            </main>
        </div>
    </div>

    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header"><h3 id="modalTitle">Add Product</h3><button class="modal-close" onclick="closeModal()"><i class="fas fa-times"></i></button></div>
            <div class="modal-body" id="modalBody"></div>
            <div class="modal-footer">
                <button class="btn btn-sm" onclick="closeModal()" style="background:#eee;color:#555">Cancel</button>
                <button class="btn btn-sm btn-primary" id="modalSave">Save</button>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script>
        // ============ SECURITY ============
        function escapeHTML(str) {
            if (!str) return '';
            return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
        }

        // ============ DATA STORE ============
        const DB_KEY = 'dps_admin_data';
        const SESSION_KEY = 'dps_session';
        let sessionToken = localStorage.getItem('dps_session_token');
        let sessionData = sessionToken ? JSON.parse(localStorage.getItem(SESSION_KEY) || 'null') : null;

        function getData() {
            const raw = localStorage.getItem(DB_KEY);
            if (raw) return JSON.parse(raw);
            return getDefaultData();
        }

        function getDefaultData() {
            return {
                products: [
                    { id:1, name:'Embellished Velvet Beret', category:'berets', price:15000, stock:true, featured:true, image:'handmade-cap.png', description:'Hand-embroidered velvet beret with decorative embellishments.' },
                    { id:2, name:'Crystal-Encrusted Cap', category:'berets', price:25000, stock:true, featured:false, image:'crystal-caps.png', description:'Cap encrusted with premium crystals and hand-sewn details.' },
                    { id:3, name:'Beaded Evening Clutch', category:'bags', price:35000, stock:true, featured:true, image:'', description:'Elegant beaded clutch for special occasions.' },
                    { id:4, name:'Stone-Embellished Tote', category:'bags', price:40000, stock:true, featured:false, image:'', description:'Leather tote with semi-precious stone embellishments.' },
                    { id:5, name:'Floral Embroidered Dress', category:'dresses', price:55000, stock:true, featured:true, image:'handmade-gown.png', description:'Hand-embroidered floral dress with premium threadwork.' },
                    { id:6, name:'Crystal Evening Gown', category:'dresses', price:70000, stock:true, featured:false, image:'', description:'Full-length gown with crystal beadwork.' },
                    { id:7, name:'Embellished Sunglasses', category:'glasses', price:8000, stock:true, featured:false, image:'', description:'Sunglasses with decorative stone accents.' },
                    { id:8, name:'Custom Phone Case', category:'glasses', price:5000, stock:true, featured:false, image:'', description:'Personalized phone case with embellishments.' },
                    { id:9, name:'Embellished Blazer', category:'suits', price:45000, stock:true, featured:true, image:'', description:'Tailored blazer with beadwork trim.' },
                    { id:10, name:'Beaded Evening Jacket', category:'suits', price:50000, stock:true, featured:false, image:'', description:'Statement jacket with intricate beadwork.' }
                ],
                discounts: [
                    { id:1, code:'WELCOME10', type:'percentage', value:10, active:true, minOrder:0, maxUses:100, used:12, starts:'2026-01-01', ends:'2026-12-31' },
                    { id:2, code:'SUMMER20', type:'percentage', value:20, active:true, minOrder:30000, maxUses:50, used:8, starts:'2026-06-01', ends:'2026-08-31' }
                ],
                orders: [
                    { id:1, name:'Chinwe O.', email:'chinwo@example.com', phone:'+234 801 xxx xxxx', item:'Beret', description:'Want a velvet beret with gold thread embroidery for a wedding.', date:'2026-09-18', status:'completed' },
                    { id:2, name:'Amara O.', email:'amara@example.com', phone:'+234 803 xxx xxxx', item:'Suit', description:'Looking for an embellished blazer for a corporate event.', date:'2026-09-19', status:'processing' },
                    { id:3, name:'David E.', email:'david@example.com', phone:'+234 805 xxx xxxx', item:'Dress', description:'Floral embroidered dress for anniversary dinner.', date:'2026-09-20', status:'pending' }
                ],
                settings: { whatsappNumber:2347036207517, businessName:'De PricelessStones', email:'hello@pricelessstones.com.ng', phone:'+234 703 620 7517', address:'Titilayo Adedoyin Omole Phase 1' }
            };
        }

        function saveData(data) { localStorage.setItem(DB_KEY, JSON.stringify(data)); }

        function refreshSession() { if (sessionData) { sessionData.time = Date.now(); localStorage.setItem(SESSION_KEY, JSON.stringify(sessionData)); } }

        // ============ TOAST ============
        function toast(message, type='success') {
            const c = document.getElementById('toastContainer');
            const t = document.createElement('div');
            t.className = 'toast ' + type;
            t.innerHTML = '<i class="fas fa-' + (type==='success'?'check-circle':type==='error'?'exclamation-circle':'info-circle') + '"></i> ' + message;
            c.appendChild(t);
            setTimeout(() => { t.style.opacity='0'; setTimeout(() => t.remove(), 300); }, 3000);
        }

        // ============ MODAL ============
        function openModal(title, bodyHTML, onSave) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalBody').innerHTML = bodyHTML;
            document.getElementById('modalOverlay').classList.add('active');
            document.getElementById('modalSave').onclick = onSave;
        }
        function closeModal() { document.getElementById('modalOverlay').classList.remove('active'); }
        document.getElementById('modalOverlay').addEventListener('click', e => { if(e.target===document.getElementById('modalOverlay')) closeModal(); });

        // ============ NAVIGATION ============
        const pages = {
            dashboard: { title:'Dashboard', render: renderDashboard },
            products: { title:'Products', render: renderProducts },
            discounts: { title:'Discounts', render: renderDiscounts },
            orders: { title:'Orders', render: renderOrders },
            settings: { title:'Settings', render: renderSettings }
        };

        function navigate(page) {
            document.querySelectorAll('.sidebar-nav a').forEach(a => a.classList.toggle('active', a.dataset.page===page));
            document.getElementById('pageTitle').textContent = pages[page].title;
            pages[page].render();
            document.getElementById('sidebar').classList.remove('open');
            refreshSession();
        }

        document.querySelectorAll('.sidebar-nav a').forEach(a => {
            a.addEventListener('click', e => { e.preventDefault(); navigate(a.dataset.page); });
        });

        document.getElementById('menuToggle').addEventListener('click', () => document.getElementById('sidebar').classList.toggle('open'));

        // ============ LOGIN ============
        async function doLogin(password) {
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                let data;
                try {
                    data = await res.json();
                } catch {
                    toast('Server unavailable. Please try again later.','error');
                    return false;
                }
                if (!res.ok || !data.success) {
                    toast(data.error || 'Invalid password', 'error');
                    return false;
                }
                sessionToken = data.token;
                sessionData = { token: data.token, expires: data.expires, time: Date.now() };
                localStorage.setItem('dps_session_token', data.token);
                localStorage.setItem(SESSION_KEY, JSON.stringify(sessionData));
                return true;
            } catch (e) {
                console.error('Login error:', e);
                toast('Network error. Check your connection.','error');
                return false;
            }
        }

        document.getElementById('loginForm').addEventListener('submit', async e => {
            e.preventDefault();
            const pw = document.getElementById('adminPassword').value;
            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Signing in...';
            const success = await doLogin(pw);
            if (success) {
        document.getElementById('loginPage').style.display = 'none';
            document.getElementById('adminApp').style.display = 'block';
            document.getElementById('adminApp').style.opacity = '1';
            document.getElementById('lastLogin').textContent = new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
            navigate('dashboard');
            toast('Welcome back, Admin!');
            }
            btn.disabled = false;
            btn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Sign In';
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            sessionToken = null;
            sessionData = null;
            localStorage.removeItem('dps_session_token');
            localStorage.removeItem(SESSION_KEY);
            clearSession();
            document.getElementById('adminApp').style.display = 'none';
            document.getElementById('loginPage').style.display = 'flex';
            document.getElementById('adminPassword').value = '';
        });

        function isSessionValid() {
            if (!sessionToken || !sessionData) return false;
            if (Date.now() > sessionData.expires) { clearSession(); return false; }
            return true;
        }
        function clearSession() {
            sessionToken = null;
            sessionData = null;
            localStorage.removeItem('dps_session_token');
            localStorage.removeItem(SESSION_KEY);
        }

        if (sessionToken && !isSessionValid()) { clearSession(); }
        document.getElementById('adminApp').style.opacity = '0';
        if (!isSessionValid()) {
            document.getElementById('loginPage').style.display = 'flex';
        } else {
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('adminApp').style.opacity = '1';
            navigate('dashboard');
        }

        setInterval(() => { if (!isSessionValid()) { clearSession(); document.getElementById('adminApp').style.display = 'none'; document.getElementById('loginPage').style.display = 'flex'; toast('Session expired. Please sign in again.','error'); } }, 60000);

        // ============ RENDER: DASHBOARD ============
        function renderDashboard() {
            const d = getData();
            const totalProducts = d.products.length;
            const totalOrders = d.orders.length;
            const activeDiscounts = d.discounts.filter(x=>x.active).length;
            const revenue = d.products.reduce((s,p)=>s+p.price,0);
            const last7 = d.orders.filter(o => { const diff = (new Date()-new Date(o.date))/(1000*60*60*24); return diff <= 7; });

            document.getElementById('pageContent').innerHTML = `
                <div class="stats-grid">
                    <div class="stat-card"><div class="stat-icon blue"><i class="fas fa-box"></i></div><div class="stat-value">${totalProducts}</div><div class="stat-label">Total Products</div></div>
                    <div class="stat-card"><div class="stat-icon green"><i class="fas fa-shopping-bag"></i></div><div class="stat-value">${totalOrders}</div><div class="stat-label">Total Orders</div></div>
                    <div class="stat-card"><div class="stat-icon orange"><i class="fas fa-tags"></i></div><div class="stat-value">${activeDiscounts}</div><div class="stat-label">Active Discounts</div></div>
                    <div class="stat-card"><div class="stat-icon red"><i class="fas fa-dollar-sign"></i></div><div class="stat-value">₦${revenue.toLocaleString()}</div><div class="stat-label">Catalog Value</div></div>
                </div>
                <div class="dashboard-grid">
                    <div class="card">
                        <div class="card-header"><h3>Recent Orders</h3><a href="#" onclick="navigate('orders')" style="color:var(--info);font-size:0.85rem;text-decoration:none">View All</a></div>
                        <div class="card-body">
                            <div class="table-wrap">
                                <table><thead><tr><th>Customer</th><th>Item</th><th>Date</th><th>Status</th></tr></thead>
                                <tbody>${d.orders.slice(-5).reverse().map(o => `<tr><td>${escapeHTML(o.name)}</td><td>${escapeHTML(o.item)}</td><td>${escapeHTML(o.date)}</td><td><span class="badge badge-${o.status==='completed'?'success':o.status==='processing'?'warning':'info'}">${escapeHTML(o.status)}</span></td></tr>`).join('')}</tbody></table>
                            </div>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-header"><h3>Product Categories</h3></div>
                        <div class="card-body">
                            <div class="chart-bars">
                                ${[...new Set(d.products.map(p=>p.category))].map(cat => {
                                    const count = d.products.filter(p=>p.category===cat).length;
                                    const height = count * 30;
                                    return `<div class="bar-group"><div class="bar" style="height:${Math.max(height,20)}px;background:var(--primary);opacity:${0.4+count*0.12}"></div><div class="bar-label">${escapeHTML(cat)}</div></div>`;
                                }).join('')}
                            </div>
                        </div>
                    </div>
                </div>`;
        }

        // ============ RENDER: PRODUCTS ============
        let productSearch = '';

        function renderProducts() {
            const d = getData();
            const filtered = d.products.filter(p => p.name.toLowerCase().includes(productSearch.toLowerCase()) || p.category.toLowerCase().includes(productSearch.toLowerCase()));

            document.getElementById('pageContent').innerHTML = `
                <div class="card">
                    <div class="card-header">
                        <h3>All Products (${filtered.length})</h3>
                        <div style="display:flex;gap:10px;align-items:center">
                            <div class="search-bar"><input type="text" placeholder="Search products..." id="productSearchInput" value="${productSearch}"></div>
                            <button class="btn btn-sm btn-primary" onclick="openAddProduct()"><i class="fas fa-plus"></i> Add Product</button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="table-wrap">
                            ${filtered.length ? `<table><thead><tr><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Featured</th><th>Actions</th></tr></thead>
                            <tbody>${filtered.map(p => `<tr>
                                <td><strong>${escapeHTML(p.name)}</strong></td>
                                <td><span class="badge badge-info">${escapeHTML(p.category)}</span></td>
                                <td>₦${p.price.toLocaleString()}</td>
                                <td><span class="badge badge-${p.stock?'success':'danger'}">${p.stock?'In Stock':'Out'}</span></td>
                                <td><span class="badge badge-${p.featured?'warning':'info'}">${p.featured?'Yes':'No'}</span></td>
                                <td class="actions">
                                    <button class="btn-edit" onclick="openEditProduct(${p.id})" title="Edit"><i class="fas fa-edit"></i></button>
                                    <button class="btn-delete" onclick="deleteProduct(${p.id})" title="Delete"><i class="fas fa-trash"></i></button>
                                </td>
                            </tr>`).join('')}</tbody></table>` : '<div class="empty-state"><i class="fas fa-box-open"></i><p>No products found.</p></div>'}
                        </div>
                    </div>
                </div>`;
            document.getElementById('productSearchInput').addEventListener('input', e => { productSearch = e.target.value; renderProducts(); });
        }

        function openAddProduct() {
            openModal('Add Product', `
                <div class="form-group"><label>Product Name</label><input id="pName" placeholder="e.g., Embellished Fedora"></div>
                <div class="form-group"><label>Category</label>
                    <select id="pCategory" onchange="toggleCustomCategory()">
                        <option value="berets">Berets & Caps</option>
                        <option value="bags">Bags & Purses</option>
                        <option value="dresses">Dresses & Tops</option>
                        <option value="glasses">Glasses & Tech</option>
                        <option value="suits">Suits & Blazers</option>
                        <option value="gift items">Gifts</option>
                        <option value="__custom__">+ Add Custom Category</option>
                    </select>
                    <div id="customCategoryGroup" style="display:none;margin-top:8px">
                        <input id="pCustomCategory" placeholder="Enter new category name" style="width:100%;padding:10px;border:2px solid var(--border);border-radius:8px;font-size:0.9rem">
                    </div>
                </div>
                <div class="form-group"><label>Price (₦)</label><input type="number" id="pPrice" placeholder="0"></div>
                <div class="form-group"><label>Description</label><textarea id="pDesc" rows="3" placeholder="Describe the product..."></textarea></div>
                <div class="form-group"><label>Product Image</label>
                    <input type="file" id="pImageUpload" accept="image/*" style="padding:10px;border:2px dashed var(--border);border-radius:8px;width:100%;font-family:inherit;cursor:pointer">
                    <small style="color:var(--light-text);font-size:0.8rem;display:block;margin-top:4px">Upload image (max 5MB)</small>
                </div>
                <div class="form-group"><label>Or Image URL</label><input id="pImage" placeholder="https://..."></div>
                <div class="form-group"><label><input type="checkbox" id="pStock" checked> In Stock</label></div>
                <div class="form-group"><label><input type="checkbox" id="pFeatured"> Featured</label></div>
            `, saveProduct);
        }

        function openEditProduct(id) {
            const d = getData();
            const p = d.products.find(x => x.id === id);
            if (!p) return;
            openModal('Edit Product', `
                <div class="form-group"><label>Product Name</label><input id="pName" value="${escapeHTML(p.name)}"></div>
                <div class="form-group"><label>Category</label>
                    <select id="pCategory" onchange="toggleCustomCategory()">
                        ${['berets','bags','dresses','glasses','suits','gift items'].map(c=>`<option value="${c}" ${p.category===c?'selected':''}>${c}</option>`).join('')}
                        <option value="__custom__" ${!['berets','bags','dresses','glasses','suits','gift items'].includes(p.category)?'selected':''}>+ ${escapeHTML(p.category)}</option>
                    </select>
                    <div id="customCategoryGroup" style="display:${!['berets','bags','dresses','glasses','suits','gift items'].includes(p.category)?'block':'none'};margin-top:8px">
                        <input id="pCustomCategory" value="${escapeHTML(p.category)}" placeholder="Category name" style="width:100%;padding:10px;border:2px solid var(--border);border-radius:8px;font-size:0.9rem">
                    </div>
                </div>
                <div class="form-group"><label>Price (₦)</label><input type="number" id="pPrice" value="${p.price}"></div>
                <div class="form-group"><label>Description</label><textarea id="pDesc" rows="3">${p.description||''}</textarea></div>
                <div class="form-group"><label>Current Image</label>${p.image?`<img src="${p.image}" alt="${p.name}" style="max-width:100px;max-height:100px;border-radius:6px;display:block;margin-bottom:8px">`:''}</div>
                <div class="form-group"><label>New Image</label>
                    <input type="file" id="pImageUpload" accept="image/*" style="padding:10px;border:2px dashed var(--border);border-radius:8px;width:100%;font-family:inherit;cursor:pointer">
                    <small style="color:var(--light-text);font-size:0.8rem;display:block;margin-top:4px">Leave empty to keep current image</small>
                </div>
                <div class="form-group"><label>Or Image URL</label><input id="pImage" value="${p.image||''}"></div>
                <div class="form-group"><label><input type="checkbox" id="pStock" ${p.stock?'checked':''}> In Stock</label></div>
                <div class="form-group"><label><input type="checkbox" id="pFeatured" ${p.featured?'checked':''}> Featured</label></div>
            `, () => saveProduct(id));
        }

        function toggleCustomCategory() {
            const sel = document.getElementById('pCategory');
            if (!sel) return;
            const group = document.getElementById('customCategoryGroup');
            if (sel.value === '__custom__') { group.style.display = 'block'; } else { group.style.display = 'none'; }
        }

        function saveProduct(existingId) {
            const d = getData();
            const nameEl = document.getElementById('pName');
            const name = nameEl.value.trim();
            if (!name) { toast('Product name is required','error'); return; }
            const customCat = document.getElementById('pCustomCategory');
            const category = document.getElementById('pCategory').value === '__custom__' && customCat ? customCat.value.trim() : document.getElementById('pCategory').value;
            if (!category) { toast('Category is required','error'); return; }
            const imageInput = document.getElementById('pImageUpload');
            let image = document.getElementById('pImage').value.trim();
            if (imageInput && imageInput.files && imageInput.files[0]) {
                if (imageInput.files[0].size > 5 * 1024 * 1024) { toast('Image too large (max 5MB)','error'); return; }
                const reader = new FileReader();
                reader.onload = function(e) {
                    doSaveProduct(existingId, name, category, e.target.result);
                };
                reader.onerror = function() { toast('Failed to read image','error'); };
                reader.readAsDataURL(imageInput.files[0]);
            } else {
                doSaveProduct(existingId, name, category, image);
            }
        }

        function doSaveProduct(existingId, name, category, image) {
            try {
                const d = getData();
                const product = {
                    id: existingId || Date.now(),
                    name,
                    category,
                    price: parseInt(document.getElementById('pPrice').value) || 0,
                    description: document.getElementById('pDesc').value.trim(),
                    image,
                    stock: document.getElementById('pStock').checked,
                    featured: document.getElementById('pFeatured').checked
                };
                if (existingId) {
                    const idx = d.products.findIndex(p => p.id === existingId);
                    if (idx !== -1) d.products[idx] = product;
                } else {
                    d.products.push(product);
                }
                saveData(d);
                closeModal();
                renderProducts();
                toast(existingId ? 'Product updated' : 'Product added');
            } catch (e) {
                console.error('Save error:', e);
                toast('Failed to save product','error');
            }
        }

        function deleteProduct(id) {
            if (!confirm('Delete this product?')) return;
            const d = getData();
            d.products = d.products.filter(p => p.id !== id);
            saveData(d);
            renderProducts();
            toast('Product deleted','error');
        }

        // ============ RENDER: DISCOUNTS ============
        function renderDiscounts() {
            const d = getData();
            document.getElementById('pageContent').innerHTML = `
                <div class="card">
                    <div class="card-header"><h3>Discount Codes</h3><button class="btn btn-sm btn-primary" onclick="openAddDiscount()"><i class="fas fa-plus"></i> New Code</button></div>
                    <div class="card-body">
                        <div class="table-wrap">
                            ${d.discounts.length ? `<table><thead><tr><th>Code</th><th>Type</th><th>Value</th><th>Min Order</th><th>Active</th><th>Uses</th><th>Actions</th></tr></thead>
                            <tbody>${d.discounts.map(d2 => `<tr>
                                <td><strong>${escapeHTML(d2.code)}</strong></td>
                                <td>${d2.type==='percentage'?'%':'₦'}</td>
                                <td>${d2.type==='percentage'?d2.value+'%':'₦'+d2.value.toLocaleString()}</td>
                                <td>₦${d2.minOrder?.toLocaleString()||0}</td>
                                <td><span class="badge badge-${d2.active?'success':'danger'}">${escapeHTML(d2.active?'Active':'Paused')}</span></td>
                                <td>${d2.used}/${d2.maxUses||'∞'}</td>
                                <td class="actions">
                                    <button class="btn-edit" onclick="toggleDiscount(${d2.id})" title="${d2.active?'Pause':'Activate'}"><i class="fas fa-${d2.active?'pause':'play'}"></i></button>
                                    <button class="btn-delete" onclick="deleteDiscount(${d2.id})" title="Delete"><i class="fas fa-trash"></i></button>
                                </td>
                            </tr>`).join('')}</tbody></table>` : '<div class="empty-state"><i class="fas fa-tags"></i><p>No discount codes yet.</p></div>'}
                        </div>
                    </div>
                </div>`;
        }

        function openAddDiscount() {
            openModal('New Discount Code', `
                <div class="form-group"><label>Code</label><input id="dCode" placeholder="e.g., SUMMER25"></div>
                <div class="form-group"><label>Type</label><select id="dType"><option value="percentage">Percentage</option><option value="fixed">Fixed Amount</option></select></div>
                <div class="form-group"><label>Value</label><input type="number" id="dValue" placeholder="e.g., 20"></div>
                <div class="form-group"><label>Min Order (₦)</label><input type="number" id="dMin" value="0"></div>
                <div class="form-group"><label>Max Uses</label><input type="number" id="dMax" placeholder="e.g., 100" value="999"></div>
                <div class="form-group"><label>Start Date</label><input type="date" id="dStart"></div>
                <div class="form-group"><label>End Date</label><input type="date" id="dEnd"></div>
            `, saveDiscount);
        }

        function saveDiscount() {
            const d = getData();
            const code = document.getElementById('dCode').value.trim().toUpperCase();
            if (!code || !document.getElementById('dValue').value) { toast('Fill all required fields','error'); return; }
            d.discounts.push({
                id: Date.now(), code, type: document.getElementById('dType').value,
                value: parseInt(document.getElementById('dValue').value),
                minOrder: parseInt(document.getElementById('dMin').value)||0,
                maxUses: parseInt(document.getElementById('dMax').value)||999,
                used:0, active:true,
                starts: document.getElementById('dStart').value || new Date().toISOString().split('T')[0],
                ends: document.getElementById('dEnd').value || '2027-12-31'
            });
            saveData(d); closeModal(); renderDiscounts(); toast('Discount code added');
        }

        function toggleDiscount(id) {
            const d = getData();
            const disc = d.discounts.find(x=>x.id===id);
            if (disc) { disc.active = !disc.active; saveData(d); renderDiscounts(); toast(disc.active?'Activated':'Paused'); }
        }

        function deleteDiscount(id) {
            if (!confirm('Delete this discount code?')) return;
            const d = getData();
            d.discounts = d.discounts.filter(x=>x.id!==id);
            saveData(d); renderDiscounts(); toast('Deleted','error');
        }

        // ============ RENDER: ORDERS ============
        function renderOrders() {
            const d = getData();
            document.getElementById('pageContent').innerHTML = `
                <div class="card">
                    <div class="card-header"><h3>All Orders (${d.orders.length})</h3></div>
                    <div class="card-body">
                        <div class="table-wrap">
                            ${d.orders.length ? `<table><thead><tr><th>Customer</th><th>Item</th><th>Date</th><th>Status</th><th>Actions</th></tr></thead>
                                <tbody>${d.orders.slice().reverse().map(o => `<tr>
                                    <td><strong>${escapeHTML(o.name)}</strong><div style="font-size:0.8rem;color:#999">${escapeHTML(o.email)}</div></td>
                                    <td><span class="badge badge-info">${escapeHTML(o.item)}</span></td>
                                    <td>${escapeHTML(o.date)}</td>
                                    <td><select class="status-select" onchange="updateOrderStatus(${o.id},this.value)">
                                        <option value="pending" ${o.status==='pending'?'selected':''}>Pending</option>
                                        <option value="processing" ${o.status==='processing'?'selected':''}>Processing</option>
                                        <option value="completed" ${o.status==='completed'?'selected':''}>Completed</option>
                                        <option value="cancelled" ${o.status==='cancelled'?'selected':''}>Cancelled</option>
                                    </select></td>
                                    <td><button class="btn-delete" onclick="deleteOrder(${o.id})"><i class="fas fa-trash"></i></button></td>
                                </tr>`).join('')}</tbody></table>` : '<div class="empty-state"><i class="fas fa-shopping-bag"></i><p>No orders yet.</p></div>'}
                        </div>
                    </div>
                </div>`;
        }

        function updateOrderStatus(id, status) {
            const d = getData();
            const o = d.orders.find(x=>x.id===id);
            if (o) { o.status = status; saveData(d); toast('Status updated'); }
        }

        function deleteOrder(id) {
            if (!confirm('Cancel this order?')) return;
            const d = getData();
            d.orders = d.orders.filter(x=>x.id!==id);
            saveData(d); renderOrders(); toast('Order cancelled','error');
        }

        // ============ RENDER: SETTINGS ============
        function renderSettings() {
            const d = getData();
            const s = d.settings;
            document.getElementById('pageContent').innerHTML = `
                <div class="card" style="max-width:600px">
                    <div class="card-header"><h3>Business Settings</h3></div>
                    <div class="card-body">
                        <div class="form-group"><label>Business Name</label><input id="setBiz" value="${s.businessName}"></div>
                        <div class="form-group"><label>Email</label><input type="email" id="setEmail" value="${s.email}"></div>
                        <div class="form-group"><label>Phone</label><input id="setPhone" value="${s.phone}"></div>
                        <div class="form-group"><label>WhatsApp Number (with country code)</label><input type="number" id="setWhatsapp" value="${s.whatsappNumber}"></div>
                        <div class="form-group"><label>Address</label><textarea id="setAddress" rows="2">${s.address}</textarea></div>
                        <hr style="margin:20px 0;border:none;border-top:1px solid #eee">
                        <h3 style="font-size:1rem;margin-bottom:12px;font-family:'Inter',sans-serif;color:var(--accent)"><i class="fas fa-users"></i> Sub-Admins</h3>
                        <div id="subAdminList">${(s.subAdmins||[]).map((sa,i)=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #eee"><div><strong>${escapeHTML(sa.name)}</strong><span style="font-size:0.8rem;color:var(--light-text);margin-left:8px">${escapeHTML(sa.email)}</span></div><button class="btn-delete" onclick="deleteSubAdmin(${i})" style="width:28px;height:28px;font-size:0.75rem"><i class="fas fa-trash"></i></button></div>`).join('')||'<p style="color:var(--light-text);font-size:0.85rem">No sub-admins yet</p>'}</div>
                        <div style="margin-top:15px;padding:15px;background:var(--secondary);border-radius:8px">
                            <p style="font-size:0.85rem;color:var(--text-secondary);margin:0 0 10px"><i class="fas fa-shield-alt"></i> <strong>Admin password</strong> is managed via Netlify environment variable <code>ADMIN_PASSWORD</code>. Update it in your Netlify site settings.</p>
                        </div>
                        <hr style="margin:20px 0;border:none;border-top:1px solid #eee">
                        <button class="btn btn-primary" onclick="saveSettings()"><i class="fas fa-save"></i> Save Settings</button>
                    </div>
                </div>`;
        }

        function addSubAdmin() {
            const name = document.getElementById('saName').value.trim();
            const email = document.getElementById('saEmail').value.trim();
            const password = document.getElementById('saPassword').value;
            if (!name || !email || !password) { toast('Fill all fields','error'); return; }
            if (password.length < 6) { toast('Password too short (min 6 chars)','error'); return; }
            const d = getData();
            if (!d.settings.subAdmins) d.settings.subAdmins = [];
            crypto.subtle.digest('SHA-256', new TextEncoder().encode(password)).then(hash => {
                const hashArray = Array.from(new Uint8Array(hash));
                const hashHex = hashArray.map(b => b.toString(16).padStart(2,'0')).join('');
                d.settings.subAdmins.push({ name, email, password: hashHex, role: 'sub-admin', createdAt: new Date().toISOString() });
                saveData(d);
                renderSettings();
                toast('Sub-admin added');
            });
        }

        function deleteSubAdmin(index) {
            const d = getData();
            d.settings.subAdmins.splice(index, 1);
            saveData(d);
            renderSettings();
            toast('Sub-admin removed','error');
        }

        async function saveSettings() {
            const d = getData();
            const s = d.settings;
            s.businessName = document.getElementById('setBiz').value;
            s.email = document.getElementById('setEmail').value;
            s.phone = document.getElementById('setPhone').value;
            s.whatsappNumber = parseInt(document.getElementById('setWhatsapp').value);
            s.address = document.getElementById('setAddress').value;
            saveData(d);
            toast('Settings saved');
        }

        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('pageContent').innerHTML += '<footer style="text-align:center;padding:20px 0;margin-top:30px;color:var(--light-text);font-size:0.85rem;border-top:1px solid #eee">Developed with <i class="fas fa-heart" style="color:#e74c3c"></i> by <a href="https://linkedin.com/in/oluwasanmiadebowale" target="_blank" style="color:var(--accent);text-decoration:none">DeltaOS Core</a></footer>';
        });
    </script>
</body>
</html>
